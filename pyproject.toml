[project]
name = "celltrace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pybind11>=2.12",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "ollama>=0.3",
    "pydantic>=2.6",
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["synthesizer", "agent", "rag", "eval"]
